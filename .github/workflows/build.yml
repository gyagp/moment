name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core tests
        run: dotnet run --project tests/Shike.Core.Tests -c Release
      - name: Build
        run: dotnet build src/Shike.App/Shike.App.csproj -c Release -p:Platform=x64 -p:RestoreLockedMode=true
      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.1.0-dev' }
          ./scripts/package.ps1 -Version $version
      - name: Verify packaged startup
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/publish/Shike.exe -ArgumentList '--startup-test artifacts/startup' -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(30000)) { $process.Kill(); throw 'Startup test timed out' }
          if ($process.ExitCode -ne 0) { throw "Startup failed: $($process.ExitCode)" }
          if (!(Test-Path artifacts/startup/result.txt)) { throw 'Startup result missing' }
          Get-Content artifacts/startup/result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Shike-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Shike-win-x64
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          if [[ -f "docs/releases/$TAG.md" ]]; then args+=(--notes-file "docs/releases/$TAG.md"); else args+=(--generate-notes); fi
          gh release create "$TAG" release/* --verify-tag --title "时刻 $TAG" "${args[@]}"
